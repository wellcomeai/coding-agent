# Продакшен-развёртывание на одном облачном сервере Timeweb (Ubuntu + Docker).
# Запуск: cp .env.example .env && (заполнить) && docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:${POSTGRES_PASSWORD}@db:5432/agent
      SANDBOX_PROVIDER: docker
      SANDBOX_IMAGE: coding-agent-sandbox:latest
      APP_VERSION: ${APP_VERSION:-dev}
    volumes:
      # Доступ к Docker для создания песочниц (контейнер на каждую сессию)
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      retries: 20

  # Только собирает образ песочницы и завершается
  sandbox-image:
    build: ./sandbox
    image: coding-agent-sandbox:latest
    command: ["true"]
    restart: "no"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
